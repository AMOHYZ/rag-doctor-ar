[project]
name = "rag-doctor-ar"
version = "0.1.0"
description = "Diagnosing and fixing a broken Arabic + English RAG pipeline, with evals that prove the before/after."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "faiss-cpu>=1.8",
    "httpx>=0.27",
    "langgraph>=0.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["faiss"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/test_wiki.py" = ["E501"]  # HTML fixture lines
