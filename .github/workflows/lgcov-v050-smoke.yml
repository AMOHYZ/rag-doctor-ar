name: lgcov @v0.5.0 smoke

on:
  pull_request:

jobs:
  lgcov:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: AMOHYZ/langgraph-regression-guard@v0.5.0
        with:
          fail-on: root-drift
